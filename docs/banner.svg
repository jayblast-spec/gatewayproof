<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="860" height="260" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="858" height="258" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="430" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">gatewayproof: conformance-testing an LLM gateway</text>

  <rect x="40" y="70" width="170" height="70" rx="8" fill="#eef4ff" stroke="#2f6fed"/>
  <text x="125" y="95" text-anchor="middle" font-size="12" font-weight="600" fill="#0b3d91">gatewayproof</text>
  <text x="125" y="112" text-anchor="middle" font-size="10" fill="#334">runConformanceSuite()</text>
  <text x="125" y="126" text-anchor="middle" font-size="10" fill="#334">deterministic requests</text>

  <path d="M210 105 H300" stroke="#57606a" stroke-width="2" marker-end="url(#arrow5)"/>

  <rect x="300" y="60" width="220" height="90" rx="8" fill="#fff7e6" stroke="#d4a017"/>
  <text x="410" y="82" text-anchor="middle" font-size="12" font-weight="600" fill="#7a5200">your gateway</text>
  <text x="410" y="99" text-anchor="middle" font-size="10" fill="#334">OpenAI-compatible</text>
  <text x="410" y="113" text-anchor="middle" font-size="10" fill="#334">streaming / usage / cost</text>
  <text x="410" y="127" text-anchor="middle" font-size="10" fill="#334">concurrency / errors</text>

  <path d="M520 105 H590" stroke="#57606a" stroke-width="2" marker-end="url(#arrow5)"/>

  <rect x="590" y="70" width="200" height="70" rx="8" fill="#f6f8fa" stroke="#57606a"/>
  <text x="690" y="95" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">deterministic mock</text>
  <text x="690" y="112" text-anchor="middle" font-size="10" fill="#334">upstream reference</text>
  <text x="690" y="126" text-anchor="middle" font-size="10" fill="#334">(known-good behavior)</text>

  <rect x="40" y="170" width="130" height="34" rx="6" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="105" y="192" text-anchor="middle" font-size="10" font-weight="700" fill="#116329">streaming: pass</text>
  <rect x="185" y="170" width="130" height="34" rx="6" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="250" y="192" text-anchor="middle" font-size="10" font-weight="700" fill="#116329">usage/cost: pass</text>
  <rect x="330" y="170" width="130" height="34" rx="6" fill="#ffebe9" stroke="#cf222e"/>
  <text x="395" y="192" text-anchor="middle" font-size="10" font-weight="700" fill="#82071e">error handling: fail</text>
  <rect x="475" y="170" width="130" height="34" rx="6" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="540" y="192" text-anchor="middle" font-size="10" font-weight="700" fill="#116329">concurrency: pass</text>

  <text x="430" y="228" text-anchor="middle" font-size="11" fill="#57606a">Catches conformance bugs -- e.g. a cost header set after streaming already began --</text>
  <text x="430" y="244" text-anchor="middle" font-size="11" fill="#57606a">before they reach a client that assumed OpenAI-compatible actually meant compatible.</text>

  <defs>
    <marker id="arrow5" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#57606a"/>
    </marker>
  </defs>
</svg>
